name: Pulso TransMi forecast submission

on:
  # Revisa cada 15 minutos si el profesor abrió una ronda. Si no hay ronda,
  # src.pipeline termina de forma segura sin crear una submission.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Acción contra la API de competencia"
        required: true
        default: forecast
        type: choice
        options:
          - forecast
          - receipt
          - leaderboard
      submission_id:
        description: "ID externo (requerido para receipt)"
        required: false
        type: string
      leaderboard_window:
        description: "Ventana del leaderboard"
        required: true
        default: cumulative
        type: choice
        options:
          - cumulative
          - rolling_24h

permissions:
  contents: read

concurrency:
  group: pulso-transmi-forecast
  cancel-in-progress: false

jobs:
  competition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar proyecto
        run: python -m pip install -e ".[ml]"

      - name: Actualizar observaciones del stream
        if: ${{ github.event_name == 'schedule' || inputs.action == 'forecast' }}
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.ingest --incremental

      - name: Generar y enviar pronóstico (o no-op si no hay ciclo)
        if: ${{ github.event_name == 'schedule' || inputs.action == 'forecast' }}
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.pipeline

      - name: Consultar recibo
        if: ${{ inputs.action == 'receipt' }}
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          test -n "$SUBMISSION_ID" || { echo "submission_id es requerido para receipt"; exit 2; }
          python -m src.pipeline --receipt "$SUBMISSION_ID"

      - name: Consultar leaderboard
        if: ${{ inputs.action == 'leaderboard' }}
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          LEADERBOARD_WINDOW: ${{ inputs.leaderboard_window }}
        run: python -m src.pipeline --leaderboard "$LEADERBOARD_WINDOW"
