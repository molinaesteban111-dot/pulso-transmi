name: Pulso TransMi ingestion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo de ejecución"
        required: true
        default: incremental
        type: choice
        options:
          - initial
          - incremental
  # Activar cuando el profesor confirme la frecuencia oficial.
  # schedule:
  #   - cron: "7,37 * * * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar proyecto
        run: python -m pip install -e .

      - name: Descargar datos históricos desde la API
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'initial' }}
        env:
          PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
        run: python examples/01_download.py

      - name: Ejecutar carga inicial
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'initial' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.ingest --initial

      - name: Ejecutar collector incremental
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'incremental' }}
        env:
          PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.ingest --incremental
