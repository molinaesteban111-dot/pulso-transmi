name: Pulso TransMi train and promote

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: pulso-transmi-training
  cancel-in-progress: false

jobs:
  train-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar proyecto
        run: python -m pip install -e ".[ml]" httpx
      - name: Descargar datos actuales
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
        run: python examples/01_download.py
      - name: Entrenar candidatos y calcular backtest
        run: python examples/04_train_models.py --data data/observations.csv
      - name: Publicar candidatos y promover champion si mejora
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/promote_model.py
