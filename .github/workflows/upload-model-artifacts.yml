name: Upload model artifacts to Supabase Storage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -e ".[ml]" httpx

      - name: Download dataset for training
        env:
          PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
        run: python examples/01_download.py

      - name: Train candidate models
        run: python examples/04_train_models.py --data data/observations.csv

      - name: Upload private model artifacts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_model_artifacts.py
